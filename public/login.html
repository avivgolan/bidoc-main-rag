<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>התחברות — BiDoc</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(160deg, #0f172a, #1e293b);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      }
      .card {
        width: 100%;
        max-width: 380px;
        margin: 16px;
        background: #ffffff;
        border-radius: 18px;
        padding: 32px 28px;
        box-shadow: 0 20px 60px rgba(0,0,0,0.35);
      }
      .mark {
        width: 44px;
        height: 44px;
        border-radius: 999px;
        background: #1e293b;
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 16px;
      }
      h1 {
        font-size: 18px;
        font-weight: 700;
        text-align: center;
        margin: 0 0 4px;
        color: #0f172a;
      }
      p.sub {
        text-align: center;
        font-size: 13px;
        color: #64748b;
        margin: 0 0 24px;
      }
      label {
        display: block;
        font-size: 12.5px;
        font-weight: 600;
        color: #334155;
        margin-bottom: 6px;
      }
      input {
        width: 100%;
        padding: 10px 12px;
        border-radius: 10px;
        border: 1px solid #cbd5e1;
        font-size: 14px;
        margin-bottom: 16px;
        font-family: inherit;
      }
      input:focus { outline: 2px solid #1e293b; outline-offset: 1px; }
      button {
        width: 100%;
        padding: 11px 12px;
        border-radius: 10px;
        border: none;
        background: #1e293b;
        color: #fff;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
      }
      button:disabled { opacity: 0.6; cursor: not-allowed; }
      button:hover:not(:disabled) { background: #0f172a; }
      .error {
        background: #fef2f2;
        color: #b91c1c;
        border: 1px solid #fecaca;
        border-radius: 10px;
        padding: 10px 12px;
        font-size: 13px;
        margin-bottom: 16px;
        display: none;
      }
      .footnote {
        text-align: center;
        font-size: 11.5px;
        color: #94a3b8;
        margin-top: 18px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="mark">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="10" rx="2"/><circle cx="12" cy="5" r="2"/><path d="M12 7v4"/><path d="M8 16h.01"/><path d="M16 16h.01"/></svg>
      </div>
      <h1>BiDoc — כניסת סופראדמין</h1>
      <p class="sub">הכלי מיועד לצוות הפיתוח ולבדיקות QA בלבד.</p>
      <div class="error" id="loginError"></div>
      <form id="loginForm">
        <label for="email">אימייל</label>
        <input id="email" type="email" autocomplete="username" required />
        <label for="password">סיסמה</label>
        <input id="password" type="password" autocomplete="current-password" required />
        <button id="submitButton" type="submit">התחבר</button>
      </form>
      <p class="footnote">מתחברים עם אותם פרטי המשתמש של מערכת BiDoc (הרשאת סופראדמין בלבד).</p>
    </div>
    <script src="/login.js?v=1"></script>
  </body>
</html>
